<!doctype html>
<!-- THROWAWAY PROTOTYPE: Three indexed-folder management models. ?variant=A|B|C -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cockpit — folder management prototype</title><style>
:root{color-scheme:dark;--bg:#171918;--panel:#272928;--line:#ffffff18;--text:#e9e9e5;--sub:#9a9c98;--blue:#39799f;--good:#9fe870;--bad:#ed8162}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101211;color:var(--text);font-family:ui-rounded,"SF Pro Rounded","Avenir Next",sans-serif}button{font:inherit;color:inherit;cursor:pointer}.shell{width:min(900px,calc(100vw - 36px));margin:11vh auto;background:var(--panel);border:1px solid #414341;border-radius:5px;box-shadow:0 28px 90px #0009}.top{padding:24px 28px 20px;border-bottom:1px solid var(--line)}h1{font-size:28px;font-weight:450;letter-spacing:-.04em;margin:0 0 5px}.sub{font-size:14px;color:var(--sub);line-height:1.45}.row{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:17px 28px;border-bottom:1px solid var(--line)}.path{font-size:18px;letter-spacing:-.025em}.meta{color:var(--sub);font-size:13px;margin-top:4px}.state{font-size:12px;color:var(--good);font-weight:800;letter-spacing:.06em;text-transform:uppercase}.state.off{color:var(--bad)}.flat{border:1px solid #ffffff2b;border-radius:4px;background:transparent;padding:8px 11px;font-size:13px}.flat:hover{background:#ffffff0d}.primary{background:var(--blue);border-color:var(--blue)}.danger{color:#f5a18d;border-color:#f5a18d55}.hint{padding:15px 28px;color:#aeb4af;font-size:13px;background:#202220}.bottom{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px;background:#1c1e1deF;border:1px solid var(--line);border-radius:13px;box-shadow:0 12px 35px #000a}.bottom button{border:0;border-radius:8px;background:#303332;padding:8px 11px}.bottom span{min-width:150px;text-align:center;font-size:12px}.statebox{position:fixed;left:18px;bottom:18px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:#171918;white-space:pre-wrap;color:#b4bbb5;font:12px ui-monospace,monospace}
/* B */.command{padding:66px 46px 43px;text-align:center}.glyph{font-size:42px;color:var(--good);margin-bottom:16px}.command h1{font-size:38px}.drop{margin:32px auto 21px;padding:35px;max-width:610px;border:1px dashed #b2b8b455;background:#ffffff05;color:#bfc4bf}.drop b{display:block;font-size:17px;font-weight:550;margin-bottom:5px}.command .primary{font-size:15px;padding:10px 16px}.recent{max-width:610px;margin:0 auto;text-align:left;border-top:1px solid var(--line)}.recent .row{padding:12px 0;border:0}
/* C */.cgrid{display:grid;grid-template-columns:235px 1fr;min-height:470px}.sidebar{padding:23px 17px;background:#1e201f;border-right:1px solid var(--line)}.brand{font:italic 27px Georgia,serif;color:var(--good);padding:1px 10px 26px}.sideitem{padding:10px;border-radius:4px;color:#a6aba7;font-size:14px}.sideitem.active{background:#ffffff12;color:#fff}.cmain{padding:29px}.cmain h1{font-size:32px}.metric{margin:27px 0 20px;padding:19px;background:#202220;border-left:3px solid var(--good)}.metric strong{font-size:26px;font-weight:450;display:block}.cmain .row{padding:13px 0}.cmain .path{font-size:16px}
@media(max-width:600px){.shell{margin:4vh auto}.cgrid{grid-template-columns:1fr}.sidebar{display:none}.command{padding:44px 20px}.statebox{display:none}}
</style></head><body><main id="app"></main><pre class="statebox" id="state"></pre><nav class="bottom"><button id="prev">←</button><span id="name"></span><button id="next">→</button></nav><script>
const names={A:'A — Quiet list',B:'B — Add-first',C:'C — Folder health'};let v=new URLSearchParams(location.search).get('variant')||'A';if(!names[v])v='A';let folders=[['~/Documents','1,842 items · updated just now','current'],['~/Projects','4,228 items · updated 2 min ago','current'],['/Volumes/Archive/Reference','unavailable · last seen yesterday','off']];
const list=folders.map((x,i)=>`<div class="row"><div><div class="path">${x[0]}</div><div class="meta">${x[1]}</div></div><div>${x[2]==='off'?'<span class="state off">Unavailable</span>':'<span class="state">Current</span>'}${i<2?' <button class="flat danger" data-remove="'+i+'">Remove</button>':' <button class="flat" data-retry="'+i+'">Retry</button>'}</div></div>`).join('');
function A(){return `<section class="shell"><header class="top"><h1>Indexed folders</h1><div class="sub">Cockpit searches filenames only in folders you add here. It does not search all of macOS.</div></header>${list}<div class="row"><button class="flat primary" data-add>+ Add folder</button><span class="meta">Changes are indexed automatically</span></div><footer class="hint">Hidden items, package contents, and linked folders are excluded by default.</footer></section>`}
function B(){return `<section class="shell command"><div class="glyph">⌁</div><h1>Choose where Cockpit looks.</h1><div class="sub">File search is intentional: type <b>'</b> in the launcher, and Cockpit searches only the folders below.</div><div class="drop"><b>Drag a folder here</b><span class="sub">or choose one from Finder</span><br><button class="flat primary" data-add style="margin-top:17px">Choose folder…</button></div><div class="recent"><div class="meta" style="padding-top:15px">CURRENT FOLDERS</div>${list}</div></section>`}
function C(){return `<section class="shell cgrid"><aside class="sidebar"><div class="brand">cockpit</div><div class="sideitem active">◉ Indexed folders</div><div class="sideitem">⌘ Launcher</div><div class="sideitem">◌ About</div></aside><section class="cmain"><h1>Folder health</h1><div class="sub">Your filename index is local and deliberately small.</div><div class="metric"><strong>6,070 items ready</strong><span class="sub">2 folders current · 1 needs attention</span></div>${list}<button class="flat primary" data-add style="margin-top:18px">Add indexed folder</button></section></section>`}
function render(){app.innerHTML=v==='A'?A():v==='B'?B():C();name.textContent=names[v];state.textContent=`THROWAWAY PROTOTYPE\nvariant: ${v}\nindexed roots: ${folders.length}\ncurrent: ${folders.filter(x=>x[2]==='current').length}\nunavailable: ${folders.filter(x=>x[2]==='off').length}\n\nTry add, remove, retry.`;document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{folders.splice(+b.dataset.remove,1);render()});document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{folders[+b.dataset.retry][1]='rescanning…';folders[+b.dataset.retry][2]='current';render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{folders.push(['~/New folder','indexing…','current']);render()})};function go(n){v=n;history.replaceState({},'',`?variant=${v}`);render()}prev.onclick=()=>go({A:'C',B:'A',C:'B'}[v]);next.onclick=()=>go({A:'B',B:'C',C:'A'}[v]);addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight')next.click()});render();
</script></body></html>
