<!doctype html>
<!-- THROWAWAY PROTOTYPE: Three Cockpit launcher interaction models, switchable with ?variant=A|B|C. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cockpit — launcher interaction prototype</title>
  <style>
    :root { color-scheme: dark; --ink:#e9e8e3; --mute:#989997; --panel:#252626; --panel2:#303131; --line:rgba(255,255,255,.09); --blue:#286486; --electric:#8de2ff; --lime:#9fe870; --danger:#ff916c; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; background:#111312; color:var(--ink); font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", sans-serif; overflow:hidden; }
    body::before { content:""; position:fixed; inset:0; opacity:.25; pointer-events:none; background-image:linear-gradient(115deg, transparent 0 48%, rgba(255,255,255,.05) 49%, transparent 50%), radial-gradient(circle at 50% 0, #303b3c 0, transparent 48%); }
    .shell { position:relative; width:min(940px, calc(100vw - 48px)); margin:10.5vh auto; border:1px solid rgba(255,255,255,.15); border-radius:18px; overflow:hidden; box-shadow:0 36px 110px #000b, inset 0 1px #fff1; background:linear-gradient(145deg,#353636,#222323 60%); }
    button,input { font:inherit } button { color:inherit; cursor:pointer } .muted { color:var(--mute) } .app-icon { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; flex:none; font-size:23px; background:#191a1a; border:1px solid #ffffff20; box-shadow:inset 0 1px #fff2; }
    .app-icon.q { background:radial-gradient(circle at 32% 28%,#5bc0ff,transparent 26%),linear-gradient(135deg,#0367ad,#0c1e54); color:#d9f2ff; font-weight:800; font-family:Georgia; }
    .app-icon.f { background:linear-gradient(135deg,#f7ca62,#9d6421); } .app-icon.t { background:linear-gradient(135deg,#6e82ff,#25286f); } .app-icon.g { background:linear-gradient(135deg,#ff7045,#731711); }
    .result { display:grid; grid-template-columns:52px 1fr auto; align-items:center; min-height:68px; padding:9px 22px; gap:14px; border-bottom:1px solid transparent; }
    .result.selected { background:linear-gradient(90deg,#28688c,#235675); } .result .title { font-size:25px; letter-spacing:-.035em; line-height:1.05; } .result .sub { font-size:15px; margin-top:4px; color:#bcbebb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .result.selected .sub { color:#d7ebf4 } .shortcut { color:#888; font-weight:650; font-size:17px; } .selected .shortcut { color:#e3f4fb }
    .bottom { position:fixed; z-index:4; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:7px; align-items:center; padding:7px; background:#171918eF; border:1px solid #ffffff20; border-radius:14px; box-shadow:0 14px 38px #000a; backdrop-filter:blur(18px); } .bottom button { border:0; border-radius:9px; background:#2b2e2d; padding:8px 12px; font-weight:700; } .bottom button:hover{background:#3e4542}.bottom span{min-width:150px;text-align:center;font-size:12px;color:#cfd5d0}.state { position:fixed; z-index:3; left:18px; bottom:18px; max-width:300px; padding:11px 13px; background:#1a1c1beF; border:1px solid #ffffff18; border-radius:10px; color:#adb3ae; font:12px ui-monospace,monospace; white-space:pre-wrap; }
    /* Variant A — deliberately flat, matte, and close to the supplied launcher */
    .shell:has(.a-head) { width:min(1120px, calc(100vw - 48px)); border-radius:5px; border-color:#404141; background:#292a2a; box-shadow:0 26px 90px #000a; }
    .a-head { display:flex; align-items:center; gap:15px; padding:22px 23px 18px; background:#2b2c2c; border-bottom:0; } .a-head .mark { width:7px; height:7px; border:0; border-radius:50%; background:#f0f0ed; box-shadow:none; } .a-input { width:100%; border:0; outline:0; background:transparent; color:#f4f3ef; font-size:37px; font-weight:400; letter-spacing:-.045em; } .a-hint { display:none; } .a-section { padding:10px 22px; background:#292a2a; color:#a4a5a2; font-size:11px; text-transform:uppercase; letter-spacing:.14em; font-weight:800; }
    .shell:has(.a-head) .result { min-height:73px; padding:10px 22px; } .shell:has(.a-head) .result.selected { background:#326b8e; } .shell:has(.a-head) .app-icon { border-radius:10px; } .shell:has(.a-head) .result .title { font-size:27px; font-weight:400; } .shell:has(.a-head) .result .sub { color:#9f9f9d; } .shell:has(.a-head) .selected .sub { color:#d7e3e8; }
    /* Variant B — intent rail makes command vs file mode explicit */
    .b-layout { display:grid; grid-template-columns:195px 1fr; min-height:480px; } .rail { padding:18px 12px; background:#1c1e1d; border-right:1px solid var(--line); } .brand { padding:5px 11px 23px; color:var(--lime); font-family:Georgia,serif; font-size:26px; font-style:italic; }.rail button { width:100%; text-align:left; border:0; background:transparent; padding:11px; margin-bottom:4px; border-radius:9px; color:#969b98; font-size:14px; }.rail button.active { color:#101411; background:var(--lime); font-weight:800; }.b-main { background:linear-gradient(120deg,#292c2a,#222323); }.b-query { padding:29px 29px 18px; border-bottom:1px solid var(--line); }.b-query label { display:block; color:var(--lime); text-transform:uppercase; font-size:11px; letter-spacing:.16em; font-weight:800; margin-bottom:11px; }.b-input { font-size:36px; width:100%; color:#fff; background:transparent; border:0; outline:0; letter-spacing:-.045em; }.b-main .result { padding-left:29px; }.b-footer{padding:13px 29px;color:#929894;font-size:12px;border-top:1px solid var(--line)}
    /* Variant C — an oversized query, action chips, and editorial results */
    .c-top { padding:31px 35px 22px; background:radial-gradient(circle at 90% 0,#27505b,transparent 44%),#252728; }.c-eyebrow{color:var(--electric);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.c-input{display:block;width:100%;color:#fff;background:transparent;border:0;outline:0;font-family:Georgia,"Iowan Old Style",serif;font-size:49px;letter-spacing:-.055em;padding:8px 0 13px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 11px;background:#ffffff10;border:1px solid #ffffff18;border-radius:999px;color:#cbd1cd;font-size:12px}.chip.hot{background:#8de2ff;color:#102326;border:0;font-weight:800}.c-results{padding:12px 18px 21px;background:#202221}.c-results .result{border-bottom:1px solid var(--line);border-radius:10px}.c-results .result.selected{box-shadow:0 4px 20px #0005}.c-status{display:flex;justify-content:space-between;padding:0 23px 13px;font-size:12px;color:#939895}
    @media(max-width:650px){.shell{width:calc(100vw - 20px);margin:3vh auto}.b-layout{grid-template-columns:1fr}.rail{display:flex;gap:4px;overflow:auto;padding:10px}.brand{display:none}.rail button{white-space:nowrap;width:auto;margin:0}.state{display:none}.result{padding:9px 13px}.result .title{font-size:20px}.a-input,.b-input{font-size:28px}.c-input{font-size:38px}}
  </style>
</head>
<body>
  <main id="app"></main>
  <pre class="state" id="state"></pre>
  <nav class="bottom" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">←</button><span id="variantName"></span><button id="next" aria-label="Next variant">→</button></nav>
<script>
const variants={A:'A — Result stack',B:'B — Intent rail',C:'C — Command canvas'};
let variant=new URLSearchParams(location.search).get('variant')||'A'; if(!variants[variant])variant='A';
let query='qui', selected=0, mode='Default';
const results=[
  {icon:'q',glyph:'Q',title:'QuickTime Player',sub:'/Applications/QuickTime Player.app',kind:'App'},
  {icon:'f',glyph:'▰',title:'Quarterly-plan.md',sub:'Notes / Work / Quarterly-plan.md',kind:'File'},
  {icon:'g',glyph:'◒',title:'Quit all apps',sub:'Close every running application',kind:'Action'},
  {icon:'t',glyph:'⌁',title:'Lock Screen',sub:'System action',kind:'Action'},
  {icon:'g',glyph:'↻',title:'Restart Mac',sub:'System action · confirmation required',kind:'Action'},
  {icon:'g',glyph:'⏻',title:'Shut Down Mac',sub:'System action · confirmation required',kind:'Action'}
];
const effectiveQuery=()=>query.startsWith("'") ? query.slice(1) : query;
const filtered=()=>results.filter(r=>{
  const activeMode=query.startsWith("'") ? 'File' : mode;
  const inMode=activeMode==='Default' ? r.kind!=='File' : activeMode==='All'||r.kind===activeMode;
  return inMode && (`${r.title} ${r.sub}`).toLowerCase().includes(effectiveQuery().toLowerCase());
});
function row(r,i){return `<div class="result ${i===selected?'selected':''}" data-i="${i}"><div class="app-icon ${r.icon}">${r.glyph}</div><div><div class="title">${r.title}</div><div class="sub">${r.sub}</div></div><div class="shortcut">${i===selected?'↵':''}</div></div>`}
function a(){return `<section class="shell"><header class="a-head"><div class="mark"></div><input class="a-input" autofocus aria-label="Search Cockpit" value="${query}"><span class="a-hint">Cockpit</span></header><div class="a-section">${filtered().length} results · ↑↓ navigate · ↵ run</div><div>${filtered().map(row).join('')||'<div class="result"><span></span><div class="title muted">No matching launcher result</div></div>'}</div></section>`}
function b(){return `<section class="shell b-layout"><aside class="rail"><div class="brand">cockpit</div>${['All','App','File','Action'].map(x=>`<button class="${mode===x?'active':''}" data-mode="${x}">${x==='All'?'⌘  Everything':x==='App'?'◉  Applications':x==='File'?'▧  Files':'⏻  Actions'}</button>`).join('')}</aside><div class="b-main"><header class="b-query"><label>Find & execute</label><input class="b-input" autofocus value="${query}" aria-label="Search Cockpit"><div class="muted" style="font-size:13px;margin-top:7px">Search one intentional catalog at a time.</div></header>${filtered().map(row).join('')||'<div class="result"><span></span><div class="title muted">Nothing in this catalog</div></div>'}<footer class="b-footer">Tab changes intent · selected folders only · no Spotlight</footer></div></section>`}
function c(){return `<section class="shell"><header class="c-top"><div class="c-eyebrow">Ready when you are</div><input class="c-input" autofocus value="${query}" aria-label="Search Cockpit"><div class="chips"><button class="chip hot" data-mode="All">Everything</button><button class="chip" data-mode="App">Apps</button><button class="chip" data-mode="File">Files</button><button class="chip" data-mode="Action">System</button></div></header><div class="c-results"><div class="c-status"><span>${filtered().length} likely matches</span><span>↵ execute · ⌘K reset</span></div>${filtered().map(row).join('')||'<div class="result"><span></span><div class="title muted">No matching launcher result</div></div>'}</div></section>`}
function render(){selected=Math.min(selected,Math.max(0,filtered().length-1)); document.querySelector('#app').innerHTML=variant==='A'?a():variant==='B'?b():c();document.querySelector('#variantName').textContent=variants[variant]; document.querySelector('#state').textContent=`THROWAWAY PROTOTYPE\nvariant: ${variant}\nquery: “${query}”\nintent: ${query.startsWith("'")?'File prefix':mode}\nselection: ${selected+1}/${filtered().length||0}\n\nTry: ↑↓, ⌘↵, Enter, Esc`;document.querySelectorAll('input').forEach(i=>{i.addEventListener('input',e=>{query=e.target.value;selected=0;render()});i.focus();i.setSelectionRange(query.length,query.length)});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;selected=0;render()});document.querySelectorAll('[data-i]').forEach(r=>r.onclick=()=>{selected=+r.dataset.i;render()})}
function setVariant(v){variant=v;const p=new URLSearchParams(location.search);p.set('variant',v);history.replaceState({},'',`?${p}`);render()};
document.querySelector('#prev').onclick=()=>setVariant({A:'C',B:'A',C:'B'}[variant]);document.querySelector('#next').onclick=()=>setVariant({A:'B',B:'C',C:'A'}[variant]);
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!['Escape','ArrowDown','ArrowUp','Enter'].includes(e.key))return;if(e.key==='ArrowDown'){selected=Math.min(selected+1,filtered().length-1);render()}if(e.key==='ArrowUp'){selected=Math.max(0,selected-1);render()}if(e.key==='Escape'){query='';selected=0;render()}if(e.key==='Enter'&&filtered()[selected])alert(e.metaKey ? `Prototype: reveal ${filtered()[selected].title} in Finder` : `Prototype action: ${filtered()[selected].title}`);if(e.key==='ArrowLeft'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName))document.querySelector('#prev').click();if(e.key==='ArrowRight'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName))document.querySelector('#next').click()});
render();
</script></body></html>
